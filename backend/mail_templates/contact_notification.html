<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Nuevo contacto</title>
</head>
<body style="margin:0;padding:0;background:#0a0c10;font-family:Inter,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0c10;padding:24px 12px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#12151c;border:1px solid #2a2f3a;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:20px 24px;background:#181c26;border-bottom:1px solid #2a2f3a;">
              <img src="{{ logo_url }}" alt="{{ site_name }}" width="40" height="40" style="vertical-align:middle;border-radius:8px;" />
              <span style="margin-left:12px;color:#e8eaef;font-size:18px;font-weight:600;vertical-align:middle;">{{ site_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <p style="margin:0 0 8px;color:#f5a623;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;">Nuevo mensaje de contacto</p>
              <h1 style="margin:0 0 16px;color:#e8eaef;font-size:22px;">{{ topic_label }}</h1>
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:16px;">
                <tr>
                  <td style="padding:8px 0;color:#8b93a7;font-size:14px;width:90px;">Nombre</td>
                  <td style="padding:8px 0;color:#e8eaef;font-size:14px;">{{ name }}</td>
                </tr>
                <tr>
                  <td style="padding:8px 0;color:#8b93a7;font-size:14px;">Email</td>
                  <td style="padding:8px 0;color:#e8eaef;font-size:14px;"><a href="mailto:{{ email }}" style="color:#f5a623;">{{ email }}</a></td>
                </tr>
                <tr>
                  <td style="padding:8px 0;color:#8b93a7;font-size:14px;">Fecha</td>
                  <td style="padding:8px 0;color:#e8eaef;font-size:14px;">{{ when }}</td>
                </tr>
              </table>
              <div style="background:#181c26;border:1px solid #2a2f3a;border-radius:8px;padding:16px;">
                <p style="margin:0 0 8px;color:#8b93a7;font-size:13px;">Mensaje</p>
                <p style="margin:0;color:#e8eaef;font-size:14px;line-height:1.6;">{{ message }}</p>
              </div>
              <p style="margin:16px 0 0;color:#8b93a7;font-size:13px;">Responde directamente a este correo para contactar con el usuario.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
