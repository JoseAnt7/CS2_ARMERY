server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/sitemap(-[a-z0-9-]+)?\.xml$ {
        proxy_pass http://backend:5000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ads.txt / robots.txt: texto plano en la raíz (AdSense, crawlers)
    location = /ads.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files /ads.txt @ads_txt_backend;
    }

    location @ads_txt_backend {
        proxy_pass http://backend:5000/ads.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        try_files /robots.txt =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
